<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | Komentokirja</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1720'/%3E%3Ctext x='6' y='23' font-family='monospace' font-size='18' font-weight='bold' fill='%233fb950'%3E$%3C/text%3E%3Crect x='19' y='9' width='6' height='15' fill='%232496ed'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
 <div class="layout">
  <aside class="sidebar">
    <a class="logo" href="/">
      <span class="prompt">$</span> komentokirja<span class="cursor"></span>
    </a>
    <nav>
      <ul>
        {{nav}}
      </ul>
    </nav>
  </aside>

  <div class="page">
    <header class="topbar">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="Hae komentoa tältä sivulta…" autocomplete="off">
        <kbd>/</kbd>
      </div>
    </header>

    <main>
      <article class="content">
        {{content}}
        <p id="no-results" hidden>Ei osumia haulla.</p>
      </article>

      <section id="notes" class="notes" data-topic="{{topic}}" hidden>
        <div class="notes-head">
          <h2>Omat lisäykset</h2>
          <p>Puuttuuko jotain? Lisää oma komento ja selitys.</p>
        </div>
        <form id="note-form">
          <div class="row">
            <input name="author" placeholder="Nimi" required maxlength="50">
            <input name="title" class="mono" placeholder="docker …" required maxlength="200">
          </div>
          <textarea name="body" placeholder="Mitä komento tekee?" rows="2" maxlength="2000"></textarea>
          <div class="row actions">
            <label class="check"><input type="checkbox" name="mine"> näytä vain omat</label>
            <button type="submit">Lisää</button>
          </div>
          <p id="note-status" hidden></p>
        </form>
        <ul id="note-list"></ul>
      </section>
    </main>
  </div>
 </div>

  <script>var PAGES = {{pages}};</script>
  <script src="/static/app.js"></script>
  <script src="/static/notes.js"></script>
</body>
</html>
