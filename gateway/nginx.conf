# dockerin dns, haetaan osotteet uudestaan 10s välein (skaalausta varten)
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_upstream {
    zone web_upstream 64k;
    server web:80 resolve;
}

upstream notes_api_upstream {
    zone notes_api_upstream 64k;
    random;
    server notes-api:8000 resolve;
}

server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /healthz {
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://notes_api_upstream;
    }

    location / {
        proxy_pass http://web_upstream;
    }
}
